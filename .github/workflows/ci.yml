name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[dev,agent]"
      - run: python -m pytest -q
      - run: python verify_robust_results.py --results results/robust-v2
      - name: Check published report
        run: python -c "import json; from pathlib import Path; d=json.loads(Path('docs/metrics.json').read_text()); assert d['report']['views']; assert Path('docs/index.html').stat().st_size > 10000"
