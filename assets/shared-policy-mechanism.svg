<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 470" role="img" aria-labelledby="title desc"><title id="title">Shared-policy DDPG training mechanism</title><desc id="desc">Two players share actor, local critic and replay. A minibatch updates the critic against target networks and the actor through its critic objective. Target networks follow soft updates.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#286887"/></marker></defs><rect width="930" height="470" fill="#faf8f4"/><g font-family="Arial,Helvetica,sans-serif" fill="#29232d"><text x="20" y="28" font-size="20" text-anchor="start" fill="#29232d" font-weight="bold">One actor and one local critic, shared by both players</text><rect x="20" y="64" width="240" height="64" fill="#e7eef0" stroke="#286887"/><text x="140.0" y="87" font-size="14" text-anchor="middle" fill="#29232d" font-weight="bold">Two Tennis players</text><text x="140.0" y="107" font-size="12" text-anchor="middle" fill="#675f6d" font-weight="normal">24 local observation values each</text><rect x="340" y="64" width="240" height="64" fill="#e7eef0" stroke="#286887"/><text x="460.0" y="87" font-size="14" text-anchor="middle" fill="#29232d" font-weight="bold">Shared actor π(s)</text><text x="460.0" y="107" font-size="12" text-anchor="middle" fill="#675f6d" font-weight="normal">24 → 256 + BN → 128 → 2 + tanh</text><rect x="660" y="64" width="240" height="64" fill="#e7eef0" stroke="#286887"/><text x="780.0" y="87" font-size="14" text-anchor="middle" fill="#29232d" font-weight="bold">Actions → environment</text><text x="780.0" y="107" font-size="12" text-anchor="middle" fill="#675f6d" font-weight="normal">Bounded to [−1, 1]; training noise</text><path d="M260 96L330 96" fill="none" stroke="#286887" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M580 96L650 96" fill="none" stroke="#286887" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M780 128V159H140V137" fill="none" stroke="#286887" stroke-width="1.5" marker-end="url(#arrow)"/><text x="450" y="181" font-size="13" text-anchor="middle" fill="#675f6d" font-weight="normal">Next local observations, rewards and done flags</text><rect x="20" y="226" width="240" height="64" fill="#e7eef0" stroke="#286887"/><text x="140.0" y="249" font-size="14" text-anchor="middle" fill="#29232d" font-weight="bold">Shared replay buffer</text><text x="140.0" y="269" font-size="12" text-anchor="middle" fill="#675f6d" font-weight="normal">One transition per player</text><rect x="340" y="226" width="240" height="64" fill="#e7eef0" stroke="#286887"/><text x="460.0" y="249" font-size="14" text-anchor="middle" fill="#29232d" font-weight="bold">Sample 128 transitions</text><text x="460.0" y="269" font-size="12" text-anchor="middle" fill="#675f6d" font-weight="normal">Target networks form TD targets</text><rect x="660" y="226" width="240" height="64" fill="#e7eef0" stroke="#286887"/><text x="780.0" y="249" font-size="14" text-anchor="middle" fill="#29232d" font-weight="bold">Local critic update</text><text x="780.0" y="269" font-size="12" text-anchor="middle" fill="#675f6d" font-weight="normal">Q(s, a), minimize TD error</text><path d="M260 258L330 258" fill="none" stroke="#286887" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M580 258L650 258" fill="none" stroke="#286887" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M140 159L140 216" fill="none" stroke="#286887" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="340" y="345" width="240" height="64" fill="#e7eef0" stroke="#286887"/><text x="460.0" y="368" font-size="14" text-anchor="middle" fill="#29232d" font-weight="bold">Shared actor update</text><text x="460.0" y="388" font-size="12" text-anchor="middle" fill="#675f6d" font-weight="normal">Maximize critic estimate Q(s, π(s))</text><path d="M780 290L590 375" fill="none" stroke="#286887" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M580 377H620V145H460V137" fill="none" stroke="#286887" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="20" y="444" font-size="14" text-anchor="start" fill="#29232d" font-weight="normal">After learning: soft-update actor/critic targets, τ = 0.01. Critic uses local observations and actions.</text></g></svg>