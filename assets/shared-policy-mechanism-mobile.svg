<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 850" role="img" aria-labelledby="title desc"><title id="title">Shared-policy DDPG training mechanism</title><desc id="desc">Stacked view of observation, actor, environment, replay, target, critic and actor update paths. No centralized critic is used.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#286887"/></marker></defs><rect width="360" height="850" fill="#faf8f4"/><g font-family="Arial,Helvetica,sans-serif" fill="#29232d"><text x="180" y="25" font-size="19" text-anchor="middle" fill="#29232d" font-weight="bold">Shared policy, local critic</text><rect x="20" y="50" width="320" height="60" fill="#e7eef0" stroke="#286887"/><text x="180.0" y="73" font-size="14" text-anchor="middle" fill="#29232d" font-weight="bold">Two Tennis players</text><text x="180.0" y="93" font-size="12" text-anchor="middle" fill="#675f6d" font-weight="normal">24-value local observation per player</text><rect x="20" y="155" width="320" height="60" fill="#e7eef0" stroke="#286887"/><text x="180.0" y="178" font-size="14" text-anchor="middle" fill="#29232d" font-weight="bold">Shared actor π(s)</text><text x="180.0" y="198" font-size="12" text-anchor="middle" fill="#675f6d" font-weight="normal">24 → 256 + BN → 128 → 2 + tanh</text><rect x="20" y="260" width="320" height="60" fill="#e7eef0" stroke="#286887"/><text x="180.0" y="283" font-size="14" text-anchor="middle" fill="#29232d" font-weight="bold">Bounded actions → environment</text><text x="180.0" y="303" font-size="12" text-anchor="middle" fill="#675f6d" font-weight="normal">Exploration noise during training</text><rect x="20" y="380" width="320" height="60" fill="#e7eef0" stroke="#286887"/><text x="180.0" y="403" font-size="14" text-anchor="middle" fill="#29232d" font-weight="bold">Shared replay buffer</text><text x="180.0" y="423" font-size="12" text-anchor="middle" fill="#675f6d" font-weight="normal">Each player contributes (s, a, r, s′, done)</text><rect x="20" y="485" width="320" height="60" fill="#e7eef0" stroke="#286887"/><text x="180.0" y="508" font-size="14" text-anchor="middle" fill="#29232d" font-weight="bold">Sample 128 transitions</text><text x="180.0" y="528" font-size="12" text-anchor="middle" fill="#675f6d" font-weight="normal">Target actor + critic form TD targets</text><rect x="20" y="590" width="320" height="60" fill="#e7eef0" stroke="#286887"/><text x="180.0" y="613" font-size="14" text-anchor="middle" fill="#29232d" font-weight="bold">Update local critic Q(s, a)</text><text x="180.0" y="633" font-size="12" text-anchor="middle" fill="#675f6d" font-weight="normal">Minimize TD error; not a joint critic</text><rect x="20" y="695" width="320" height="60" fill="#e7eef0" stroke="#286887"/><text x="180.0" y="718" font-size="14" text-anchor="middle" fill="#29232d" font-weight="bold">Update the shared actor</text><text x="180.0" y="738" font-size="12" text-anchor="middle" fill="#675f6d" font-weight="normal">Maximize the local critic’s Q estimate</text><path d="M180 115L180 146" fill="none" stroke="#286887" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M180 220L180 251" fill="none" stroke="#286887" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M180 325L180 371" fill="none" stroke="#286887" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M180 445L180 476" fill="none" stroke="#286887" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M180 550L180 581" fill="none" stroke="#286887" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M180 655L180 686" fill="none" stroke="#286887" stroke-width="1.5" marker-end="url(#arrow)"/><text x="20" y="800" font-size="13" text-anchor="start" fill="#29232d" font-weight="normal">After learning: soft-update targets, τ = 0.01.</text><text x="20" y="825" font-size="12" text-anchor="start" fill="#675f6d" font-weight="normal">Actor and critic weights are shared by both players.</text></g></svg>